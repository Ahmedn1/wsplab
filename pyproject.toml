[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wsplab"
dynamic = ["version"]
description = "Weight-space programming: let an LLM read, edit and write neural network weights, end to end."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ahmed Dawod" }]
keywords = ["weight-space programming", "llm", "model editing", "interpretability", "neural networks", "patches"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
torch = ["torch>=2.6"]
kernel = ["torch>=2.6", "scipy", "scikit-learn", "pandas", "sympy", "networkx", "safetensors", "tokenizers"]
lm = ["torch>=2.6", "transformers>=4.57", "safetensors", "tokenizers"]
vllm = ["vllm"]
eval = ["math-verify==0.9.0", "datasets"]
hub = ["huggingface-hub>=0.30"]
openai = ["openai>=1.60"]
anthropic = ["anthropic>=0.60"]
all = ["wsplab[torch,kernel,lm,eval,hub,openai,anthropic]"]
dev = ["pytest>=8", "ruff>=0.11", "build"]
experiments = ["matplotlib>=3.9", "scikit-learn", "datasets", "pyarrow", "pillow", "torchvision"]

[project.urls]
Homepage = "https://github.com/Ahmedn1/wsplab"
Repository = "https://github.com/Ahmedn1/wsplab"
Issues = "https://github.com/Ahmedn1/wsplab/issues"
Changelog = "https://github.com/Ahmedn1/wsplab/blob/main/CHANGELOG.md"
Findings = "https://github.com/Ahmedn1/wsplab/blob/main/FINDINGS.md"

[project.scripts]
wsplab = "wsplab.cli:main"

[tool.hatch.version]
path = "src/wsplab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wsplab"]

[tool.hatch.build.targets.sdist]
include = ["src/wsplab", "LICENSE", "NOTICE", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "network: needs network access to the pinned upstream repo",
  "gpu: needs a CUDA GPU",
  "model: downloads a real model checkpoint",
]

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
