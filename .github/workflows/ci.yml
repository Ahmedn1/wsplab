name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[torch,kernel,eval,openai,anthropic,dev]' --extra-index-url https://download.pytorch.org/whl/cpu
          wsplab setup
      - name: Lint
        run: ruff check src tests
      - name: Test (CPU, no network or model downloads)
        run: pytest tests -q --ignore=tests/gpu -m "not network and not model and not gpu"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
